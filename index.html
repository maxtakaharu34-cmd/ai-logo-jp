<body>
<div id="app">
<h1 class="title">AIロゴメーカー</h1>
<div class="input-row">
  <input id="name" type="text" placeholder="ブランド名 / 店舗名" maxlength="20" />
  <button id="btn-gen">✨ 生成</button>
</div>

  <button id="btn-png" disabled>📥 PNG保存</button>
  <button id="btn-gen2" class="primary">🎲 もう1回</button>
</div>

</div>
<script>
(()=>{
'use strict';
const SVG_NS='http://www.w3.org/2000/svg';
const FONTS=['Mochiy Pop P One','Bebas Neue','Playfair Display','Pacifico','Press Start 2P'];
const PALETTES=[
['#ff6b35','#ffd56b','#fff'],['#5fc4ff','#a874e0','#fff'],['#10b981','#fef3c7','#1f2937'],
['#000','#ffe066','#ff5fa2'],['#fff','#000','#ff3a3a'],['#1e3a8a','#fbbf24','#fff'],
['#831843','#fce7f3','#f9a8d4'],['#064e3b','#a7f3d0','#fff']
];
const SHAPES=['none','circle','square','hex','badge','underline','arch'];
const $=(id)=>document.getElementById(id);
let selected=null;
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/0x100000000}}
function pick(arr,r){return arr[Math.floor(r()*arr.length)]}
function setAttrs(el,a){for(const k in a)el.setAttribute(k,a[k])}
function svgEl(tag,attrs){const e=document.createElementNS(SVG_NS,tag);if(attrs)setAttrs(e,attrs);return e}
function buildLogo(name,seed){
  const r=rng(seed);
  const font=pick(FONTS,r);
  const pal=pick(PALETTES,r);
  const shape=pick(SHAPES,r);
  const upper=r()<.4;
  const display=upper?name.toUpperCase():name;
  const fontSize=Math.max(12,40-display.length*1.5);
  const bg=pal[0],fg=pal[2],accent=pal[1];
  const svg=svgEl('svg',{viewBox:'0 0 200 200',xmlns:SVG_NS,style:'background:'+bg});
  if(shape==='circle')svg.appendChild(svgEl('circle',{cx:100,cy:100,r:80,fill:accent,opacity:.25}));
  else if(shape==='square')svg.appendChild(svgEl('rect',{x:20,y:20,width:160,height:160,fill:accent,opacity:.2,rx:14}));
  else if(shape==='hex')svg.appendChild(svgEl('polygon',{points:'100,20 170,60 170,140 100,180 30,140 30,60',fill:accent,opacity:.22}));
  else if(shape==='badge')svg.appendChild(svgEl('rect',{x:10,y:60,width:180,height:80,fill:accent,opacity:.3,rx:40}));
  else if(shape==='underline')svg.appendChild(svgEl('rect',{x:30,y:135,width:140,height:6,fill:accent,rx:3}));
  else if(shape==='arch')svg.appendChild(svgEl('path',{d:'M30 130 Q100 30 170 130',stroke:accent,'stroke-width':6,fill:'none'}));
  const initial=(name.trim().charAt(0)||'?').toUpperCase();
  const showInitial=r()<.35;
  const rotate=r()<.25?-3+Math.floor(r()*7):0;
  const g=svgEl('g',{transform:`rotate(${rotate} 100 100)`});
  if(showInitial){
    const t1=svgEl('text',{x:100,y:80,'text-anchor':'middle','font-family':font,'font-size':56,fill:fg,'font-weight':900});
    t1.textContent=initial;g.appendChild(t1);
    const t2=svgEl('text',{x:100,y:135,'text-anchor':'middle','font-family':font,'font-size':Math.min(fontSize,18),fill:fg,'font-weight':700});
    t2.textContent=display;g.appendChild(t2);
  }else{
    const t=svgEl('text',{x:100,y:115,'text-anchor':'middle','font-family':font,'font-size':fontSize+8,fill:fg,'font-weight':900});
    t.textContent=display;g.appendChild(t);
  }
  svg.appendChild(g);
  return svg;
}
function render(name){
  const grid=$('grid');while(grid.firstChild)grid.removeChild(grid.firstChild);
  if(!name){
    const e=document.createElement('div');e.className='empty';e.textContent='ブランド名を入れて\n「✨ 生成」を押すと\n8パターン作るよ';grid.appendChild(e);return;
  }
  const base=Date.now()&0xffffffff;
  for(let i=0;i<8;i++){
    const card=document.createElement('div');card.className='logo-card';
    card.appendChild(buildLogo(name,base+i*7919));
    card.addEventListener('click',()=>{
      document.querySelectorAll('.logo-card').forEach(c=>c.classList.remove('sel'));
      card.classList.add('sel');selected=card;
      $('btn-png').disabled=false;
    });
    grid.appendChild(card);
  }
}
function downloadPng(){
  if(!selected)return;
  const svgEl0=selected.querySelector('svg');
  const xml=new XMLSerializer().serializeToString(svgEl0);
  const svgBlob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(svgBlob);
  const img=new Image();
  img.onload=()=>{
    const canvas=document.createElement('canvas');canvas.width=800;canvas.height=800;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,800,800);
    URL.revokeObjectURL(url);
    canvas.toBlob(b=>{
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='logo.png';a.click();
    });
  };
  img.src=url;
}
$('btn-gen').addEventListener('click',()=>render($('name').value.trim()));
$('btn-gen2').addEventListener('click',()=>{const n=$('name').value.trim();if(n)render(n);else $('name').focus()});
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')render($('name').value.trim())});
$('btn-png').addEventListener('click',downloadPng);
render('');
})();
</script>
